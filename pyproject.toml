[project]
name = "nonebot-plugin-bilinovel"
version = "0.1.5"
authors = [
    { name = "AuYaMi", email = "SIX18318463527@163.com" }
]
description = "NoneBot2 哔哩轻小说下载爬虫插件"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.5.0,<3.0.0",
    "nonebot-adapter-onebot>=2.4.6,<3.0.0",
    "nonebot-plugin-htmlrender[playwright]>=0.8.0,<0.9.0",
    "aiohttp>=3.9.0,<4.0.0",
    "lxml>=5.0.0,<6.0.0",
    "ebooklib>=0.18,<0.19"
]
[project.urls]
Homepage = "https://github.com/AuYaMi/nonebot_plugin_bilinovel"
Repository = "https://github.com/AuYaMi/nonebot_plugin_bilinovel"
[project.entry-points."nonebot.plugins"]
nonebot-plugin-bilinovel = "nonebot_plugin_bilinovel"
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["nonebot_plugin_bilinovel*"]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = ["nonebot_plugin_bilinovel"]
env_startswith = ["BILINOVEL_"]
